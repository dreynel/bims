        <text x="825" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#444444">(Tier 2 Final Sign-off for Clearances)</text>

        <!-- ROW 2 (DOWN) -->
        <!-- UC13 (Left) -->
        <ellipse cx="270" cy="210" rx="225" ry="32" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/>
        <text x="270" y="203" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#000000">Oversee Lupon Dispute Resolutions</text>
        <text x="270" y="221" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#444444">(Mediation, Settlement &amp; CFA Issuance)</text>

