        <line x1="0" y1="-30" x2="0" y2="12" stroke="#000000" stroke-width="2.2"/>
        <line x1="-26" y1="-16" x2="26" y2="-16" stroke="#000000" stroke-width="2.2"/>
        <line x1="0" y1="12" x2="-20" y2="44" stroke="#000000" stroke-width="2.2"/>
        <line x1="0" y1="12" x2="20" y2="44" stroke="#000000" stroke-width="2.2"/>
