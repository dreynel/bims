        <text x="825" y="203" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#000000">Sign &amp; Issue Official Clearances</text>
        <text x="825" y="221" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#444444">(Executive Dual-Seal Authorization)</text>
    </g>

