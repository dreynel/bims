<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="150" cy="150" r="145" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Inner Circle Sky / Landscape -->
  <circle cx="150" cy="150" r="95" fill="url(#skyGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Green Rice Hills / Field -->
  <path d="M 55 180 Q 110 140 150 160 Q 200 130 245 180 L 245 245 L 55 245 Z" fill="#15803d"/>
  <path d="M 55 200 Q 130 170 170 190 Q 210 170 245 205 L 245 245 L 55 245 Z" fill="#166534"/>

  <!-- Sun Rays (Philippine Sun Motif) -->
  <circle cx="150" cy="120" r="22" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="3">
    <line x1="150" y1="90" x2="150" y2="82"/>
    <line x1="150" y1="150" x2="150" y2="158"/>
    <line x1="120" y1="120" x2="112" y2="120"/>
    <line x1="180" y1="120" x2="188" y2="120"/>
    <line x1="129" y1="99" x2="123" y2="93"/>
    <line x1="171" y1="141" x2="177" y2="147"/>
    <line x1="129" y1="141" x2="123" y2="147"/>
    <line x1="171" y1="99" x2="177" y2="93"/>
  </g>

  <!-- Coastal Water Waves (Dumangas Coastline) -->
  <path d="M 55 220 Q 90 210 120 220 T 180 220 T 245 220 L 245 245 L 55 245 Z" fill="#0284c7" opacity="0.8"/>

  <!-- Text Along Curved Paths -->
  <path id="textArcTop" d="M 35 150 A 115 115 0 1 1 265 150" fill="none"/>
  <path id="textArcBottom" d="M 265 150 A 115 115 0 0 1 35 150" fill="none"/>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14.5" fill="#ffffff" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      BARANGAY DACUTAN
    </textPath>
  </text>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#fef08a" letter-spacing="1.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      DUMANGAS, ILOILO • 1968
    </textPath>
  </text>

  <!-- Decorative Stars -->
  <polygon points="48,150 51,142 59,142 53,137 55,129 48,134 41,129 43,137 37,142 45,142" fill="#fbbf24"/>
  <polygon points="252,150 255,142 263,142 257,137 259,129 252,134 245,129 247,137 241,142 249,142" fill="#fbbf24"/>
</svg>
